syntax = "proto3";

package neighborhood.library.v1;

import "google/protobuf/timestamp.proto";

enum Genre {
  GENRE_UNSPECIFIED = 0;
  GENRE_FICTION = 1;
  GENRE_NON_FICTION = 2;
  GENRE_MYSTERY = 3;
  GENRE_SCIENCE_FICTION = 4;
  GENRE_FANTASY = 5;
  GENRE_BIOGRAPHY = 6;
  GENRE_HISTORY = 7;
  GENRE_ROMANCE = 8;
  GENRE_THRILLER = 9;
  GENRE_CHILDREN = 10;
  GENRE_OTHER = 11;
}

message Book {
  int32 id = 1;
  string title = 2;
  string author = 3;
  string isbn = 4;
  optional int32 publication_year = 5;
  optional string publisher = 6;
  Genre genre = 7;
  optional string description = 8;
  int32 total_quantity = 9;
  int32 available_quantity = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message BookMinimal {
  int32 id = 1;
  string title = 2;
  string author = 3;
  string isbn = 4;
}

message MemberMinimal {
  int32 id = 1;
  string name = 2;
  string email = 3;
  optional string phone = 4;
}

message Member {
  int32 id = 1;
  string name = 2;
  string email = 3;
  optional string phone = 4;
  optional string address = 5;
  string membership_start_date = 6;
  optional string membership_end_date = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Loan {
  int32 id = 1;
  int32 book_id = 2;
  int32 member_id = 3;
  google.protobuf.Timestamp borrowed_at = 4;
  google.protobuf.Timestamp due_at = 5;
  optional google.protobuf.Timestamp returned_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

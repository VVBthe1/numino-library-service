syntax = "proto3";

package neighborhood.library.v1;

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
}

// Issues JWTs for the single configured admin user.
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
}

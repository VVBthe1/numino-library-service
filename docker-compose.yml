services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neighborhood_library
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neighborhood_library"]
      interval: 5s
      timeout: 5s
      retries: 10

  library-service:
    build: ./library-service
    environment:
      APP_NAME: library-service
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/neighborhood_library
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - library-service

volumes:
  postgres_data:

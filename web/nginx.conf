server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export emits books.html etc.; map /books → books.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # gRPC-Web → Envoy (same-origin for the browser)
    location ~ ^/neighborhood\.library\.v1\. {
        proxy_pass http://envoy:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_set_header x-grpc-web $http_x_grpc_web;
        proxy_set_header x-user-agent $http_x_user_agent;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://library-service:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
